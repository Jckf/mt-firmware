name: Sync and build

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [jckf/main]
    paths: [builds.json]
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: false
        description: Only this patch branch (blank for all in builds.json)
      force_build:
        type: boolean
        default: false
        description: Build even if upstream has not moved

permissions:
  contents: write
  issues: write

# Runs rebase the same branches and rewrite the same releases, so they must not overlap.
concurrency:
  group: sync-and-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: meshtastic/firmware
  UPSTREAM_BRANCH: develop

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.sync.outputs.builds }}
      releases: ${{ steps.sync.outputs.releases }}
      failed: ${{ steps.sync.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ci

      - uses: actions/checkout@v7
        with:
          path: fw
          fetch-depth: 0
          # Fine-grained PAT, this repo only, Contents + Workflows read/write. GITHUB_TOKEN cannot push
          # branches whose history touches .github/workflows/, which every upstream rebase does.
          # Checks out this branch; sync.sh fetches upstream and the patch branches itself.
          token: ${{ secrets.SYNC_PAT }}

      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_BRANCH: ${{ inputs.branch }}
          # A builds.json change means new targets or branches, so build everything.
          FORCE_BUILD: ${{ inputs.force_build || github.event_name == 'push' }}
        run: ci/scripts/sync.sh ci/builds.json fw

      - name: Fail on branches that did not rebase
        if: steps.sync.outputs.failed != '[]'
        env:
          FAILED: ${{ steps.sync.outputs.failed }}
        run: |
          echo "Did not rebase cleanly: $FAILED"
          exit 1

  build:
    needs: sync
    if: ${{ !cancelled() && needs.sync.outputs.builds != '' && needs.sync.outputs.builds != '[]' }}
    name: ${{ matrix.branch }} ${{ matrix.pio_env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          submodules: recursive

      - id: version
        env:
          SUFFIX: ${{ matrix.suffix }}
          BUILD_LOCATION: local
        run: echo "long=$(./bin/buildinfo.py long)-$SUFFIX" >> "$GITHUB_OUTPUT"

      - uses: meshtastic/gh-action-firmware@main
        with:
          pio_platform: ${{ matrix.platform }}
          pio_env: ${{ matrix.pio_env }}
          pio_target: build

      # ESP32 steps below follow upstream's build_firmware.yml so the release folder flashes the same way.
      - name: ESP32 - Download unified OTA firmware
        if: matrix.platform == 'esp32' || matrix.platform == 'esp32s3'
        working-directory: release
        env:
          PIO_PLATFORM: ${{ matrix.platform }}
        run: curl -fL -o "mt-$PIO_PLATFORM-ota.bin" "https://github.com/meshtastic/esp32-unified-ota/releases/latest/download/mt-$PIO_PLATFORM-ota.bin"

      - name: ESP32-C* - Download BLE-only OTA firmware
        if: matrix.platform == 'esp32c3' || matrix.platform == 'esp32c6'
        working-directory: release
        run: curl -fL -o bleota-c3.bin https://github.com/meshtastic/firmware-ota/releases/latest/download/firmware-c3.bin

      - name: Add OTA file to manifest
        if: startsWith(matrix.platform, 'esp32')
        working-directory: release
        env:
          PIO_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PIO_PLATFORM" == esp32 || "$PIO_PLATFORM" == esp32s3 ]]; then OTA_FILE="mt-$PIO_PLATFORM-ota.bin"; else OTA_FILE=bleota-c3.bin; fi
          [[ -f "$OTA_FILE" ]] || exit 0
          OTA_MD5=$(md5sum "$OTA_FILE" | cut -d' ' -f1)
          OTA_SIZE=$(stat -c%s "$OTA_FILE")
          for manifest in firmware-*.mt.json; do
            [[ -f "$manifest" ]] || continue
            jq --arg name "$OTA_FILE" --arg md5 "$OTA_MD5" --argjson bytes "$OTA_SIZE" --arg part app1 \
              'if .files | map(select(.name == $name)) | length == 0 then .files += [{"name": $name, "md5": $md5, "bytes": $bytes, "part_name": $part}] else . end' \
              "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.pio_env }}-${{ steps.version.outputs.long }}
          overwrite: true
          path: |
            release/*.mt.json
            release/*.bin
            release/*.elf
            release/*.uf2
            release/*.hex
            release/*.zip
            release/device-*.sh
            release/device-*.bat

  # One rolling release per patch branch, tag <suffix>-latest, with stable asset names so the
  # download links never change. Published only when every target of the branch built.
  release:
    needs: [sync, build]
    if: ${{ !cancelled() && needs.sync.outputs.releases != '' && needs.sync.outputs.releases != '[]' }}
    name: release ${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.releases) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*.${{ matrix.short }}-${{ matrix.suffix }}
          path: dist

      - name: Package and publish
        env:
          BRANCH: ${{ matrix.branch }}
          SUFFIX: ${{ matrix.suffix }}
          DESCRIPTION: ${{ matrix.description }}
          SHA: ${{ matrix.sha }}
          SHORT: ${{ matrix.short }}
          UPSTREAM: ${{ matrix.upstream }}
          COUNT: ${{ matrix.count }}
          GITHUB_TOKEN: ${{ github.token }}
          # Moving the tag onto a commit whose history touches .github/workflows/ needs the PAT.
          # The release itself uses GITHUB_TOKEN, so it does not trigger upstream's release workflows.
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          TAG="$SUFFIX-latest"
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          mkdir -p dist out
          shopt -s nullglob

          dirs=(dist/firmware-*)
          if (( ${#dirs[@]} != COUNT )); then
            echo "::error::$BRANCH: $COUNT targets, ${#dirs[@]} built. Not publishing a partial release."
            exit 1
          fi

          rows=""
          for d in "${dirs[@]}"; do
            name=${d#dist/}
            [[ $name =~ ^firmware-(.+)-([0-9]+\.[0-9]+\.[0-9]+\.$SHORT-$SUFFIX)$ ]] || { echo "::error::unexpected artifact $name"; exit 1; }
            pio_env=${BASH_REMATCH[1]}
            version=${BASH_REMATCH[2]}
            zip_name="firmware-$pio_env-$SUFFIX.zip"
            (cd "$d" && zip -qr "../../out/$zip_name" .)
            rows+="| \`$pio_env\` | [$zip_name]($REPO_URL/releases/download/$TAG/$zip_name) |"$'\n'
          done

          {
            echo "**$version**, built from [\`$SHORT\`]($REPO_URL/commit/$SHA) on [\`$BRANCH\`]($REPO_URL/tree/$BRANCH), on top of upstream [\`${UPSTREAM:0:7}\`](https://github.com/meshtastic/firmware/commit/$UPSTREAM)."
            echo
            [[ -n "$DESCRIPTION" ]] && { echo "$DESCRIPTION"; echo; }
            echo "| Board | Download |"
            echo "| --- | --- |"
            printf '%s' "$rows"
            echo
            echo "Built $(date -u '+%Y-%m-%d %H:%M UTC'). Every new build replaces this release; the links stay the same."
          } > notes.md

          if GH_TOKEN=$SYNC_PAT gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            GH_TOKEN=$SYNC_PAT gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null
          else
            GH_TOKEN=$SYNC_PAT gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi

          export GH_TOKEN=$GITHUB_TOKEN
          title="$BRANCH (latest)"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/*.zip --clobber
            # Drop boards that were removed from builds.json.
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r asset; do
              [[ -f "out/$asset" ]] || gh release delete-asset "$TAG" "$asset" -R "$GITHUB_REPOSITORY" -y
            done
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "$title" --notes-file notes.md out/*.zip
          fi
          echo "Published $REPO_URL/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
